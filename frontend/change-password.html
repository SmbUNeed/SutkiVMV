<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      media="print"
      onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
	<link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png">
	<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
	<link rel="manifest" href="/favicon/site.webmanifest">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Новый пароль</h1>
        <p class="subtitle">Придумайте новый пароль для вашего аккаунта</p>

        <div class="auth-error" id="formError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="formErrorText"></span>
        </div>

        <div class="auth-success" id="formSuccess" style="display:none;
            background:var(--green-bg,#f0fdf4);border:1px solid var(--green,#16a34a);
            border-radius:8px;padding:12px 16px;color:var(--green,#16a34a);
            font-size:0.9rem;margin-bottom:16px;">
            <i class="fa-solid fa-circle-check"></i>
            Пароль успешно изменён! <a href="login.html">Войти</a>
        </div>

        <div id="formBody">
            <div class="form-group">
                <label>Новый пароль</label>
                <div class="pw-wrap">
                    <input type="password" id="newPassword" placeholder="Минимум 6 символов" autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('newPassword', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <div class="pw-wrap">
                    <input type="password" id="confirmPassword" placeholder="Повторите пароль" autocomplete="new-password">
                    <button type="button" class="pw-toggle" onclick="togglePw('confirmPassword', this)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button class="auth-submit" id="submitBtn" onclick="doChange()">Сохранить пароль</button>
        </div>

        <p class="auth-alt"><a href="login.html">← Вернуться к входу</a></p>
    </div>
</main>

<script src="auth.js" defer></script>
<script defer>
    function togglePw(id, btn) {
        const inp    = document.getElementById(id);
        const isText = inp.type === 'text';
        inp.type = isText ? 'password' : 'text';
        btn.querySelector('i').className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    }

    // Читаем token и email из URL
    const params = new URLSearchParams(location.search);
    const token  = params.get('token');
    const email  = params.get('email');

    // Если нет токена — ссылка неверная
    if (!token || !email) {
        document.getElementById('formBody').style.display = 'none';
        document.getElementById('formErrorText').textContent = 'Ссылка недействительна или устарела';
        document.getElementById('formError').classList.add('show');
    }

    async function doChange() {
        const newPassword     = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorEl         = document.getElementById('formError');
        const btn             = document.getElementById('submitBtn');
        errorEl.classList.remove('show');

        if (!newPassword || newPassword.length < 6) {
            document.getElementById('formErrorText').textContent = 'Пароль должен быть минимум 6 символов';
            errorEl.classList.add('show');
            return;
        }
        if (newPassword !== confirmPassword) {
            document.getElementById('formErrorText').textContent = 'Пароли не совпадают';
            errorEl.classList.add('show');
            return;
        }

        btn.disabled    = true;
        btn.textContent = 'Сохраняем...';

        try {
            const res = await fetch(`${API_URL}/auth/reset-password`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ email, token, newPassword })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Ошибка');

            document.getElementById('formBody').style.display   = 'none';
            document.getElementById('formSuccess').style.display = 'block';
        } catch (err) {
            document.getElementById('formErrorText').textContent = err.message;
            errorEl.classList.add('show');
            btn.disabled    = false;
            btn.textContent = 'Сохранить пароль';
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doChange(); });
</script>
</body>
</html>
