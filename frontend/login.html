<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
	<script>
		(function() {
			const saved = localStorage.getItem('sutkivmv_theme');
			const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      media="print" 
      onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	</noscript>
	
	<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <div id="headerUser"></div>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Добро пожаловать</h1>
        <p class="subtitle">Войдите, чтобы управлять бронированиями</p>

        <div class="auth-error" id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="loginErrorText"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <div class="pw-wrap">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="auth-submit" id="loginBtn" onclick="doLogin()">Войти</button>

        <p class="auth-alt">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
		<p class="auth-alt"><a href="forgot-password.html">Забыли пароль?</a></p>
    </div>
</main>

<script src="auth.js" defer></script>
<script src="login.js" defer></script>
</body>
</html>
