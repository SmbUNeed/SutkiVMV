<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

	<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <div id="headerUser"></div>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Добро пожаловать</h1>
        <p class="subtitle">Войдите, чтобы управлять бронированиями</p>

        <div class="auth-error" id="loginError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="loginErrorText"></span>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <div class="pw-wrap">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="pw-toggle" onclick="togglePw('loginPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="auth-submit" id="loginBtn" onclick="doLogin()">Войти</button>

        <p class="auth-alt">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>
</main>

<script src="auth.js"></script>
<script>
if (isLoggedIn()) location.href = 'index.html';

function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    btn.querySelector('i').className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
}

function showError(msg) {
    const errorEl = document.getElementById('loginError');
    document.getElementById('loginErrorText').textContent = msg;
    errorEl.classList.add('show');
}

async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl  = document.getElementById('loginError');
    const btn      = document.getElementById('loginBtn');
    errorEl.classList.remove('show');

    if (!email || !password) {
        showError('Заполните все поля'); return;
    }

    btn.disabled = true;
    btn.textContent = 'Входим...';

    try {
        const res  = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Неверный email или пароль');
        setAuth(data);
        location.href = 'index.html';
    } catch (err) {
        showError(err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Войти';
    }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
