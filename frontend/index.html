          media="print"
          onload="this.media='all'">

<body>

<main class="container">
    <!-- Controls bar -->
    <div class="controls-bar">
        <div class="controls-bar-left">
            <button class="btn-filter-open" id="btnFilterOpen" onclick="openFilterPanel()">
                <i class="fa-solid fa-sliders"></i> Фильтры
                <span class="filter-badge" id="filterBadge"></span>
            </button>
            <div class="sort-wrapper">
                <i class="fa-solid fa-arrow-up-wide-short"></i>
                <select id="sortSelect" onchange="applyFilters()">
                    <option value="default">Рекомендованные</option>
                    <option value="price_asc">Сначала дешевле</option>
                    <option value="price_desc">Сначала дороже</option>
                    <option value="area_desc">Больше площадь</option>
                </select>
            </div>
        </div>
        <span class="results-count" id="resultsCount"></span>
    </div>

    <section class="apartments-grid" id="apartmentsGrid"></section>
</main>

<footer class="footer">
    <div class="container footer-content">
        <div>
            <h4>SutkiVMV</h4>
            <p>Комфортная аренда квартир посуточно<br>в Минеральных Водах</p>
        </div>
        <div>
            <h4>Контакты</h4>
            <p>Email: sutkivmv@gmail.com<br>Телефон: <a href="tel:+79283597478">+7 (928) 359-74-78</a></p>
        </div>
    </div>
</footer>

<!-- ── FILTER PANEL ─────────────────────────────────────── -->
<div class="filter-overlay" id="filterOverlay" onclick="closeFilterPanel()"></div>
<div class="filter-panel" id="filterPanel">
    <div class="filter-panel-header">
        <span class="filter-panel-title"><i class="fa-solid fa-sliders" style="color:var(--primary);margin-right:8px;font-size:0.95rem;"></i>Фильтры</span>
        <button class="filter-panel-close" onclick="closeFilterPanel()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="filter-panel-body">
        <!-- Гости -->
        <div>
            <label class="filter-group-label">Количество гостей</label>
            <input type="number" id="guests" min="1" max="20" placeholder="Например, 2">
        </div>
        <!-- Цена -->
        <div>
            <label class="filter-group-label">Цена за ночь (₽)</label>
            <div class="price-row">
                <input type="number" id="priceMin" placeholder="От" min="0">
                <span style="color:var(--ink-3);font-size:0.8rem;font-weight:700;flex-shrink:0;">—</span>
                <input type="number" id="priceMax" placeholder="До" min="0">
            </div>
        </div>
        <!-- Удобства -->
        <div>
            <label class="filter-group-label">Удобства <span id="amenitySelectedCount" style="color:var(--primary);display:none;"></span></label>
            <div class="amenity-check-list" id="amenityCheckList">
                <div style="color:var(--ink-3);font-size:0.85rem;padding:8px 0;">Загрузка...</div>
            </div>
        </div>
    </div>
    <div class="filter-panel-footer">
        <button class="btn-reset-filters" onclick="resetFilters()">
            <i class="fa-solid fa-rotate-left"></i> Сбросить
        </button>
        <button class="btn-apply-filters" onclick="applyFilters(); closeFilterPanel();">
            Показать квартиры
        </button>
    </div>
</div>

<!-- ── MODAL квартиры ──────────────────────────────────── -->
<div class="modal-overlay" id="apartmentModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="modal-body">
            <div class="modal-left">
                <div class="gallery" id="modalGallery">
                    <img src="" alt="" class="main-img" id="modalMainImg">
                    <div class="thumbnails" id="modalThumbs"></div>
                </div>
                <h2 id="modalTitle"></h2>
                <p class="modal-specs" id="modalSpecs"></p>
                <!-- Вкладки -->
                <div class="modal-tabs">
                    <button class="modal-tab active" onclick="switchTab('desc')">Описание</button>
                    <button class="modal-tab" onclick="switchTab('amenities')">Удобства</button>
                    <button class="modal-tab" onclick="switchTab('rules')">Правила</button>
                    <button class="modal-tab" onclick="switchTab('nearby')">Рядом</button>
                </div>

                <div class="modal-tab-content" id="tab-desc">
                    <p id="modalDesc"></p>
                </div>
                <div class="modal-tab-content" id="tab-amenities" style="display:none;">
                    <div class="modal-amenities" id="modalAmenities"></div>
                </div>
                <div class="modal-tab-content" id="tab-rules" style="display:none;">
                    <div id="modalRules"></div>
                </div>
                <div class="modal-tab-content" id="tab-nearby" style="display:none;">
                    <div id="modalNearby"></div>
                </div>

            </div>
            <div class="modal-right">
                <div class="booking-widget">
                    <h3>Бронирование</h3>
                    <div class="booking-price" id="modalPrice"></div>
                    <div id="bookingCalendar"></div>
                    <div class="booking-summary" id="bookingSummary" style="display:none;"></div>
                    <div id="bookingWidget"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="auth.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
