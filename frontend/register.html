<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
	<script>
		(function() {
			const saved = localStorage.getItem('sutkivmv_theme');
			const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      media="print" 
      onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	</noscript>
    <script src="https://unpkg.com/imask"></script>
	
	<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
	<link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
	<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
	<link rel="manifest" href="favicon/site.webmanifest">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <div id="headerUser"></div>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Создайте аккаунт</h1>
        <p class="subtitle">Регистрация займёт меньше минуты</p>

        <div class="auth-error" id="regError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="regErrorText"></span>
        </div>

        <div class="form-group">
            <label>Ваше имя</label>
            <input type="text" id="regName" placeholder="Иванов Иван" autocomplete="name">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="regPhone" placeholder="+7 900 000-00-00" autocomplete="tel">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Пароль <span style="color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0;">(минимум 6 символов)</span></label>
            <div class="pw-wrap">
                <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>
		<p class="auth-alt" style="font-size:.8rem;">Регистрируясь, вы соглашаетесь с <a href="privacy.html">политикой конфиденциальности</a></p>

        <button class="auth-submit" id="regBtn" onclick="doRegister()">Зарегистрироваться</button>

        <p class="auth-alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
</main>

<script src="auth.js" defer></script>
<script src="register.js" defer></script>
</body>
</html>
