<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      media="print" 
      onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	</noscript>
    <script src="https://unpkg.com/imask"></script>

	<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
            <div id="headerUser"></div>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Создайте аккаунт</h1>
        <p class="subtitle">Регистрация займёт меньше минуты</p>

        <div class="auth-error" id="regError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="regErrorText"></span>
        </div>

        <div class="form-group">
            <label>Ваше имя</label>
            <input type="text" id="regName" placeholder="Иванов Иван" autocomplete="name">
        </div>
        <div class="form-group">
            <label>Телефон</label>
            <input type="tel" id="regPhone" placeholder="+7 900 000-00-00" autocomplete="tel">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Пароль <span style="color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0;">(минимум 6 символов)</span></label>
            <div class="pw-wrap">
                <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
                <button type="button" class="pw-toggle" onclick="togglePw('regPassword', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="auth-submit" id="regBtn" onclick="doRegister()">Зарегистрироваться</button>

        <p class="auth-alt">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </div>
</main>

<script src="auth.js"></script>
<script>
    if (typeof isLoggedIn === 'function' && isLoggedIn()) {
        location.href = 'index.html';
    }

    const phoneInput = document.getElementById('regPhone');
    if (phoneInput) {
        IMask(phoneInput, {
            mask: '+{7} (000) 000-00-00',
            lazy: false,
            placeholderChar: '_'
        });
    }

    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }
    function validatePhone(phone) {
        return phone.replace(/\D/g, '').length === 11;
    }
    function togglePw(id, btn) {
        const inp = document.getElementById(id);
        const isText = inp.type === 'text';
        inp.type = isText ? 'password' : 'text';
        btn.querySelector('i').className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    }

    function showError(msg, field = null) {
        const errorEl  = document.getElementById('regError');
        document.getElementById('regErrorText').textContent = msg;
        errorEl.classList.add('show');
        if (field) {
            field.style.borderColor = 'var(--red)';
            field.focus();
        }
    }

    async function doRegister() {
        const fields = {
            name:  document.getElementById('regName'),
            phone: document.getElementById('regPhone'),
            email: document.getElementById('regEmail'),
            pass:  document.getElementById('regPassword')
        };
        const errorEl = document.getElementById('regError');
        const btn     = document.getElementById('regBtn');

        errorEl.classList.remove('show');
        Object.values(fields).forEach(f => f.style.borderColor = '');

        if (!fields.name.value.trim())                   return showError('Введите имя', fields.name);
        if (!validateEmail(fields.email.value.trim()))   return showError('Введите корректный Email адрес', fields.email);
        if (!validatePhone(fields.phone.value))          return showError('Введите номер телефона полностью', fields.phone);
        if (fields.pass.value.length < 6)               return showError('Пароль должен быть минимум 6 символов', fields.pass);

        btn.disabled = true;
        btn.textContent = 'Создаём аккаунт...';

        try {
            const cleanPhone = fields.phone.value.replace(/\D/g, '');
            const res = await fetch(`${API_URL}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName:    fields.name.value.trim(),
                    phoneNumber: cleanPhone,
                    email:       fields.email.value.trim(),
                    password:    fields.pass.value
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.message || 'Ошибка регистрации');
            if (data.token) {
			if (typeof setAuth === 'function') setAuth(data);
				location.href = 'index.html';
			} else {
				// Показываем сообщение о подтверждении email
				const card = document.querySelector('.auth-card');
				card.innerHTML = `
					<div style="text-align:center;padding:20px 0;">
						<i class="fa-solid fa-envelope-circle-check" style="font-size:3rem;color:var(--primary);margin-bottom:16px;display:block;"></i>
						<h2>Проверьте почту!</h2>
						<p style="color:var(--ink-3);margin-top:8px;">
							Мы отправили письмо на <b>${fields.email.value.trim()}</b>.<br>
							Перейдите по ссылке в письме чтобы завершить регистрацию.
						</p>
						<a href="index.html" style="display:inline-block;margin-top:24px;" class="auth-submit">На главную</a>
					</div>
				`;
			}
        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
        }
    }
</script>
</body>
</html>
