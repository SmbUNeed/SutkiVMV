<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
	<script>
		(function() {
			const saved = localStorage.getItem('sutkivmv_theme');
			const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      media="print" 
      onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	</noscript>
</head>
<body class="cabinet-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>

        <div class="header-contacts">
            <a href="https://max.ru/u/f9LHodD0cOJt5_8nBNoKKj4uQ985gCyApObnd0K5Gnbi0TT3lORA5EOsNEE" target="_blank" class="contact-btn contact-max" aria-label="Max">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="15" height="15" style="vertical-align:middle;">
                    <defs>
                        <linearGradient id="maxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffb85a"/>
                            <stop offset="100%" stop-color="#d07820"/>
                        </linearGradient>
                    </defs>
                    <path fill="url(#maxGrad)" fill-rule="evenodd" d="M350.4,9.6C141.8,20.5,4.1,184.1,12.8,390.4c3.8,90.3,40.1,168,48.7,253.7,2.2,22.2-4.2,49.6,21.4,59.3,31.5,11.9,79.8-8.1,106.2-26.4,9-6.1,17.6-13.2,24.2-22,27.3,18.1,53.2,35.6,85.7,43.4,143.1,34.3,299.9-44.2,369.6-170.3C799.6,291.2,622.5-4.6,350.4,9.6h0ZM269.4,504c-11.3,8.8-22.2,20.8-34.7,27.7-18.1,9.7-23.7-.4-30.5-16.4-21.4-50.9-24-137.6-11.5-190.9,16.8-72.5,72.9-136.3,150-143.1,78-6.9,150.4,32.7,183.1,104.2,72.4,159.1-112.9,316.2-256.4,218.6h0Z"/>
                </svg>
                <span class="contact-label">Max</span>
            </a>
            <a href="https://t.me/PaWellRe" target="_blank" class="contact-btn contact-tg" aria-label="Telegram">
                <i class="fa-brands fa-telegram"></i>
                <span class="contact-label">Telegram</span>
            </a>
            <a href="tel:+79054113687" class="contact-btn contact-phone" aria-label="Позвонить">
                <i class="fa-solid fa-phone"></i>
                <span class="contact-label">+7 (905) 411-36-87</span>
            </a>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn" onclick="toggleMobileMenu()" aria-label="Меню">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="header-actions" id="headerActions">
            <button class="mobile-menu-close" id="mobileMenuClose" onclick="closeMobileMenu()" aria-label="Закрыть меню">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                    <i class="fa-solid fa-moon icon-moon"></i>
                    <i class="fa-solid fa-sun icon-sun"></i>
                </button>
                <div id="headerUser"></div>
            </div>
        </div>
        <div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()"></div>
    </div>
</header>

<main class="cabinet-main">
    <div class="container">
        <div class="cabinet-grid">

            <!-- Сайдбар -->
            <aside class="cabinet-sidebar">
                <div class="cabinet-avatar-block">
                    <div class="cabinet-avatar" id="cabinetAvatarLetters">?</div>
                    <div class="cabinet-username" id="cabinetName">Загрузка...</div>
                    <div class="cabinet-email" id="cabinetEmail"></div>
                </div>
                <nav class="cabinet-nav">
                    <div class="cabinet-nav-item active" onclick="showTab('bookings', this)">
                        <i class="fa-solid fa-calendar-check"></i> Мои бронирования
                    </div>
                    <div class="cabinet-nav-item" onclick="showTab('profile', this)">
                        <i class="fa-solid fa-user-pen"></i> Данные профиля
                    </div>
                </nav>
                <button class="cabinet-logout-btn" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Выйти
                </button>
            </aside>

            <!-- Контент -->
            <div class="cabinet-content-card">

                <!-- Бронирования -->
                <div class="cabinet-section active" id="tab-bookings">
                    <div class="cabinet-section-title">
                        <i class="fa-solid fa-calendar-check" style="color:var(--primary)"></i>
                        Мои бронирования
                    </div>
                    <div id="bookingsList">
                        <div class="empty-state">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            <p>Загрузка...</p>
                        </div>
                    </div>
                </div>

                <!-- Профиль -->
                <div class="cabinet-section" id="tab-profile">
                    <div class="cabinet-section-title">
                        <i class="fa-solid fa-user-pen" style="color:var(--primary)"></i>
                        Данные профиля
                    </div>

                    <div class="profile-success" id="profileSuccess">
                        <i class="fa-solid fa-check"></i> Данные успешно сохранены
                    </div>

                    <div class="profile-form">
                        <div class="form-row" style="margin-bottom:16px;">
                            <div class="form-group">
                                <label>Имя</label>
                                <input type="text" id="pfName" placeholder="Иванов Иван">
                            </div>
                            <div class="form-group">
                                <label>Телефон</label>
                                <input type="tel" id="pfPhone" placeholder="+7 900 000-00-00">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom:20px;">
                            <label>Email</label>
                            <input type="email" id="pfEmail" disabled
                                style="background:var(--paper-2);color:var(--ink-3);">
                            <small style="color:var(--ink-3);font-size:12px;margin-top:4px;display:block;">
                                Email изменить нельзя
                            </small>
                        </div>

                        <div style="border-top:1px solid var(--border);padding-top:20px;">
                            <p style="font-size:13px;color:var(--ink-3);margin-bottom:14px;font-weight:600;">
                                <i class="fa-solid fa-lock" style="color:var(--primary);margin-right:5px;"></i>
                                Смена пароля — оставьте пустым, если менять не нужно
                            </p>
                            <div class="form-group" style="max-width:360px;">
                                <label>Новый пароль</label>
                                <div class="pw-wrap">
                                    <input type="password" id="pfPassword" placeholder="Новый пароль (мин. 6 символов)">
                                    <button type="button" class="pw-toggle" onclick="togglePw('pfPassword', this)">
                                        <i class="fa-solid fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button class="profile-save-btn" id="pfSaveBtn" onclick="saveProfile()">
                            <i class="fa-solid fa-floppy-disk"></i> Сохранить изменения
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<script src="auth.js" defer></script>
<script src="cabinet.js" defer></script>
</body>
</html>
