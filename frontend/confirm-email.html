<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
	<script>
		(function() {
			const saved = localStorage.getItem('sutkivmv_theme');
			const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение email — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      media="print" 
      onload="this.media='all'">
	<noscript>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	</noscript>

	<link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
	<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
</head>
<body>
<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
    </div>
</header>

<main class="container" style="display:flex;justify-content:center;align-items:center;min-height:60vh;">
    <div style="text-align:center;max-width:480px;">
        <div id="statusIcon" style="font-size:3rem;margin-bottom:16px;">
            <i class="fa-solid fa-spinner fa-spin"></i>
        </div>
        <h2 id="statusTitle">Подтверждаем email...</h2>
        <p id="statusText" style="color:var(--ink-3);"></p>
        <a href="index.html" id="statusLink" style="display:none;" class="btn-apply-filters">
            На главную
        </a>
    </div>
</main>

<script src="auth.js" defer></script>
<script src="confirm-email.js" defer></script>
</body>
</html>
