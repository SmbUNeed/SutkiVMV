<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — SutkiVMV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      media="print"
      onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
</head>
<body class="auth-page">

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-right">
            <button class="theme-toggle" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
                <i class="fa-solid fa-moon icon-moon"></i>
                <i class="fa-solid fa-sun icon-sun"></i>
            </button>
        </div>
    </div>
</header>

<main class="auth-main">
    <div class="auth-card">
        <h1>Восстановление пароля</h1>
        <p class="subtitle">Введите email — мы отправим ссылку для смены пароля</p>

        <div class="auth-error" id="formError">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="formErrorText"></span>
        </div>

        <div class="auth-success" id="formSuccess" style="display:none;
            background:var(--green-bg,#f0fdf4);border:1px solid var(--green,#16a34a);
            border-radius:8px;padding:12px 16px;color:var(--green,#16a34a);
            font-size:0.9rem;margin-bottom:16px;">
            <i class="fa-solid fa-circle-check"></i>
            <span id="formSuccessText"></span>
        </div>

        <div id="formBody">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="resetEmail" placeholder="your@email.com" autocomplete="email">
            </div>

            <button class="auth-submit" id="submitBtn" onclick="doReset()">Отправить письмо</button>
        </div>

        <p class="auth-alt"><a href="login.html">← Вернуться к входу</a></p>
    </div>
</main>

<script src="auth.js" defer></script>
<script defer>
    async function doReset() {
        const email   = document.getElementById('resetEmail').value.trim();
        const errorEl = document.getElementById('formError');
        const btn     = document.getElementById('submitBtn');
        errorEl.classList.remove('show');

        if (!email) {
            document.getElementById('formErrorText').textContent = 'Введите email';
            errorEl.classList.add('show');
            return;
        }

        btn.disabled    = true;
        btn.textContent = 'Отправляем...';

        try {
            const res  = await fetch(`${API_URL}/auth/change-password-email`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(email)
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.message || 'Ошибка');

            document.getElementById('formBody').style.display = 'none';
            document.getElementById('formSuccessText').textContent = data.message;
            document.getElementById('formSuccess').style.display   = 'block';
        } catch (err) {
            document.getElementById('formErrorText').textContent = err.message;
            errorEl.classList.add('show');
            btn.disabled    = false;
            btn.textContent = 'Отправить письмо';
        }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });
</script>
</body>
</html>
