<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SutkiVMV — Аренда квартир посуточно в Минеральных Водах</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">Sutki<span>VMV</span></a>
        <div class="header-contacts">
            <a href="tel:+79283597478"><i class="fa-solid fa-phone"></i> +7 (928) 359-74-78</a>
            <a href="https://t.me/PaWellRe" target="_blank"><i class="fa-brands fa-telegram"></i> Telegram</a>
        </div>
        <div id="headerUser"></div>
    </div>
</header>

<main class="container">
    <section class="controls-section">
        <div class="filters">
            <div class="filter-group">
                <label>Гости</label>
                <input type="number" id="guests" min="1" max="10" placeholder="Сколько" style="width:110px;">
            </div>
            <div class="filter-group">
                <label>Цена (₽ / ночь)</label>
                <div class="price-inputs">
                    <input type="number" id="priceMin" placeholder="От" style="width:90px;">
                    <input type="number" id="priceMax" placeholder="До" style="width:90px;">
                </div>
            </div>
            <div class="filter-group">
                <label>Удобство</label>
                <select id="amenityFilter" style="width:160px;">
                    <option value="">Любое</option>
                </select>
            </div>
        </div>
        <div class="sorting">
            <label>Сортировка</label>
            <select id="sortSelect" style="width:200px;">
                <option value="default">Рекомендованные</option>
                <option value="price_asc">Сначала дешевле</option>
                <option value="price_desc">Сначала дороже</option>
                <option value="area_desc">Больше площадь</option>
            </select>
        </div>
    </section>

    <section class="apartments-grid" id="apartmentsGrid"></section>
</main>

<footer class="footer">
    <div class="container footer-content">
        <div>
            <h4>SutkiVMV</h4>
            <p>Комфортная аренда квартир посуточно<br>в Минеральных Водах</p>
        </div>
        <div>
            <h4>Контакты</h4>
            <p>Email: info@sutkivmv.ru<br>Телефон: +7 (928) 359-74-78</p>
        </div>
    </div>
</footer>

<!-- Модалка квартиры -->
<div class="modal-overlay" id="apartmentModal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeModal()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="modal-body">
            <div class="modal-left">
                <div class="gallery" id="modalGallery">
                    <img src="" alt="" class="main-img" id="modalMainImg">
                    <div class="thumbnails" id="modalThumbs"></div>
                </div>
                <h2 id="modalTitle"></h2>
                <p class="modal-specs" id="modalSpecs"></p>
                <div class="modal-amenities" id="modalAmenities"></div>
                <div class="modal-description">
                    <h3>Описание</h3>
                    <p id="modalDesc"></p>
                </div>
            </div>
            <div class="modal-right">
                <div class="booking-widget">
                    <h3>Бронирование</h3>
                    <div class="booking-price" id="modalPrice"></div>
                    <div id="bookingCalendar"></div>
                    <div class="booking-summary" id="bookingSummary" style="display:none;"></div>
                    <div id="bookingWidget"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
